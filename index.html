<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地震學期末報告時間軸</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 40px 0;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 50px;
            font-size: 2.5em;
            letter-spacing: 2px;
        }

        /* 返回首頁按鈕 */
        .back-to-home {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background-color: #2c3e50;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        .back-to-home:hover {
            background-color: #e74c3c;
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4);
        }

        /* 時間軸主體 */
        .timeline {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
        }

        /* 中央的數線 */
        .timeline::after {
            content: '';
            position: absolute;
            width: 6px;
            background-color: #7f8c8d;
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -3px;
            border-radius: 3px;
        }

        /* 時間軸項目容器 */
        .container {
            padding: 15px 40px;
            position: relative;
            background-color: inherit;
            width: 50%;
            box-sizing: border-box;
        }

        /* 數線上的節點 */
        .container::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            right: -13px;
            background-color: #e74c3c;
            border: 4px solid #fff;
            top: 25px;
            border-radius: 50%;
            z-index: 1;
            box-shadow: 0 0 0 3px #e74c3c44;
        }

        .left { left: 0; }
        .right { left: 50%; }

        .left::before {
            content: " ";
            height: 0;
            position: absolute;
            top: 28px;
            width: 0;
            z-index: 1;
            right: 30px;
            border: medium solid white;
            border-width: 10px 0 10px 10px;
            border-color: transparent transparent transparent white;
        }

        .right::before {
            content: " ";
            height: 0;
            position: absolute;
            top: 28px;
            width: 0;
            z-index: 1;
            left: 30px;
            border: medium solid white;
            border-width: 10px 10px 10px 0;
            border-color: transparent white transparent transparent;
        }

        .right::after { left: -15px; }

        /* 內容卡片 */
        .content {
            padding: 20px 30px;
            background-color: white;
            position: relative;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .content:hover { transform: translateY(-5px); }
        .date { font-weight: bold; color: #e74c3c; font-size: 1.2em; margin-bottom: 10px; }
        .title { font-size: 1.3em; margin-bottom: 15px; }

        /* 圖片排版樣式 */
        .image-gallery {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        
        .image-gallery img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        
        .image-gallery img:hover {
            transform: scale(1.02);
        }

        /* --- 新增：PDF 內嵌預覽樣式 --- */
        .pdf-viewer {
            margin-top: 15px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background-color: #f9f9f9;
        }
        .pdf-title-bar {
            background-color: #34495e;
            color: white;
            padding: 8px 12px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .pdf-viewer iframe {
            width: 100%;
            height: 350px;
            border: none;
            display: block;
        }

        /* 期末報告顯眼效果樣式 */
        .content.highlight-final {
            border: 2px solid #e74c3c;
            background-color: #fff9f9;
            box-shadow: 0 6px 25px rgba(231, 76, 60, 0.25);
            animation: pulseGlow 2.5s infinite ease-in-out;
        }
        
        .final-badge {
            background-color: #e74c3c;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 8px;
            vertical-align: middle;
            display: inline-block;
            animation: blinkEffect 1.5s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 6px 20px rgba(231, 76, 60, 0.2); transform: scale(1); }
            50% { box-shadow: 0 6px 30px rgba(231, 76, 60, 0.5); transform: scale(1.02); }
        }

        @keyframes blinkEffect {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* 特效按鈕群組 */
        .link-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        /* 特效按鈕 */
        .quake-link {
            display: inline-block;
            padding: 10px 20px;
            background-color: #34495e;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
            cursor: pointer;
            text-align: center;
        }

        .quake-link:hover { background-color: #e74c3c; }

        /* --- 斷層轉場特效區塊 --- */
        #quake-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            display: flex;
            opacity: 0;
        }

        #quake-overlay.active {
            opacity: 1;
        }

        .crust {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        .crust.left {
            clip-path: polygon(0 0, 50% 0, 48% 20%, 52% 40%, 47% 60%, 53% 80%, 50% 100%, 0 100%);
        }
        .crust.right {
            clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%, 53% 80%, 47% 60%, 52% 40%, 48% 20%);
        }

        .crack-line {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 100%;
            background: #ff4700;
            clip-path: polygon(50% 0, 48% 20%, 52% 40%, 47% 60%, 53% 80%, 50% 100%, 48% 100%, 51% 80%, 45% 60%, 50% 40%, 46% 20%, 48% 0);
            opacity: 0;
            box-shadow: 0 0 30px 10px #ff4700;
        }

        #quake-overlay.active .crack-line {
            animation: crackFlash 0.3s ease-in forwards;
        }

        #quake-overlay.active .crust.left {
            animation: faultLeft 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            animation-delay: 0.3s;
        }
        #quake-overlay.active .crust.right {
            animation: faultRight 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            animation-delay: 0.3s;
        }

        /* 左右震動效果 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }
        .shake-active { animation: shake 0.4s ease-in-out infinite; }

        @keyframes crackFlash {
            0% { opacity: 0; height: 0%; }
            100% { opacity: 1; height: 100%; }
        }

        @keyframes faultLeft {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50vw, 10vh); opacity: 0; }
        }

        @keyframes faultRight {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50vw, -10vh); opacity: 0; }
        }

        /* RWD */
        @media screen and (max-width: 600px) {
            .back-to-home { top: auto; bottom: 20px; left: 50%; transform: translateX(-50%); }
            .back-to-home:hover { transform: translateX(-50%) scale(1.05); }
            .timeline::after { left: 31px; }
            .container { width: 100%; padding-left: 70px; padding-right: 25px; }
            .container::before { left: 60px; border: medium solid white; border-width: 10px 10px 10px 0; border-color: transparent white transparent transparent; }
            .left::after, .right::after { left: 21px; }
            .right { left: 0%; }
        }
    </style>
</head>
